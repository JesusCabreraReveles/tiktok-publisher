<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="duration" content="15">
<meta name="size" content="1080x1350">
<title>DR test vs production isolation</title>
<style>
  :root {
    --bg: #0c1a13; --panel: #13281d; --line: #2c5a40;
    --green: #2ecc71; --lime: #c6f432; --text: #eaf5ee; --muted: #8fb5a0; --red: #ff5a5f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; color: var(--text); position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: radial-gradient(circle, #1d3a2a 2px, transparent 2.5px);
    background-size: 44px 44px; opacity: .55; }
  .tag { position: absolute; left: 80px; top: 70px; font-size: 28px; font-weight: 700;
    letter-spacing: 4px; color: var(--lime); animation: in .5s ease-out 0s both; }
  .title { position: absolute; left: 80px; top: 120px; width: 920px; font-size: 72px;
    font-weight: 800; line-height: 1.05; letter-spacing: -1px; }
  .t1 { animation: in .5s ease-out .1s both, out .4s ease-in 6.3s forwards; }
  .t2 { animation: in .5s ease-out 6.8s both; }
  .t2 span, .t1 span { color: var(--lime); }
  .bottom { position: absolute; left: 80px; right: 80px; top: 1215px; font-size: 40px;
    font-weight: 700; text-align: center; animation: in .6s ease-out 10.8s both; }
  .bottom span { color: var(--lime); }
  .brand { position: absolute; left: 80px; bottom: 34px; font-size: 22px; color: var(--muted);
    animation: in .5s 0s both; }
  .step { position: absolute; right: 80px; bottom: 34px; font-size: 22px; color: var(--muted); }
  .s1 { animation: in .3s 0s both, out .3s 6.3s forwards; }
  .s2 { animation: in .3s 6.8s both; }
  svg { position: absolute; left: 0; top: 0; }
  svg text { font-family: "Inter", "DejaVu Sans", sans-serif; fill: var(--text); }

  .box rect.frame { fill: var(--panel); stroke: var(--line); stroke-width: 3; }
  .box .name { font-size: 36px; font-weight: 700; }
  .box .sub { font-size: 24px; fill: var(--muted); }

  .draw { fill: none; stroke: var(--green); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; }
  .bad { stroke: var(--red); }
  .flow { fill: none; stroke: var(--lime); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: .03 .05; opacity: 0; }

  /* ---------- 1 / 2 · the problem ---------- */
  .zones  { animation: in .5s .5s both; }
  .b-papp { animation: pop .5s ease-out .8s both; }
  .b-pdb  { animation: pop .5s ease-out 1.0s both; }
  .b-dapp { animation: pop .5s ease-out 1.2s both; }
  .b-drep { animation: pop .5s ease-out 1.4s both; }
  .a-prod { animation: draw .5s ease-in-out 1.7s forwards; }
  .a-rep  { animation: draw .5s ease-in-out 2.0s forwards; }
  .l-rep  { animation: in .4s 2.3s both; }
  .a-bad  { animation: draw .8s ease-in-out 2.6s forwards, out .3s 6.3s forwards; }
  .f-db   { animation: pop .3s ease-out 3.5s both, out .3s 6.3s forwards; }
  .lost   { animation: in .4s 3.9s both, out .3s 6.3s forwards; }

  /* ---------- 2 / 2 · the fix ---------- */
  .fence  { animation: in .5s 7.0s both; }
  .stub   { animation: in .4s 7.3s both; }
  .a-dr   { animation: draw .6s ease-in-out 7.6s forwards; }
  .note   { animation: in .5s 8.4s both; }
  .flow   { animation: in .3s 8.6s forwards, dash 1s linear 8.6s infinite; }

  .pkt { offset-rotate: 0deg; opacity: 0; }
  .p1 { offset-path: path("M 780 530 L 780 760");
        animation: in .2s 8.7s forwards, move 1.4s ease-in-out 8.7s infinite; }

  @keyframes in   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes out  { to { opacity: 0; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes dash { to { stroke-dashoffset: -.08; } }
  @keyframes move { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  g { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="tag">ARCHITECTURE · WEDNESDAY</div>
  <div class="title t1">The DR test reached<br><span>into production.</span></div>
  <div class="title t2">The fix: fence the<br><span>DR site off.</span></div>

  <svg width="1080" height="1350" viewBox="0 0 1080 1350">
    <!-- zones -->
    <g class="zones">
      <rect x="80" y="330" width="440" height="610" rx="22" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="14 10"/>
      <rect x="560" y="330" width="440" height="610" rx="22" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="14 10"/>
      <text x="104" y="378" font-size="22" font-weight="700" letter-spacing="3" style="fill: var(--muted)">PRODUCTION</text>
      <text x="584" y="378" font-size="22" font-weight="700" letter-spacing="3" style="fill: var(--muted)">DR SITE</text>
    </g>

    <!-- arrows -->
    <path class="draw a-prod" pathLength="1" d="M 300 530 L 300 760"/>
    <path class="draw a-rep" pathLength="1" d="M 470 845 L 610 845"/>
    <path class="draw bad a-bad" pathLength="1" d="M 700 530 L 700 645 L 400 645 L 400 760"/>
    <path class="draw a-dr" pathLength="1" d="M 780 530 L 780 760"/>
    <path class="flow" pathLength="1" d="M 780 530 L 780 760"/>
    <g class="l-rep">
      <text x="540" y="820" text-anchor="middle" font-size="22" style="fill: var(--muted)">replicates</text>
    </g>

    <!-- boxes -->
    <g class="box b-papp">
      <rect class="frame" x="130" y="410" width="340" height="120" rx="18"/>
      <text class="name" x="300" y="463" text-anchor="middle">Prod app</text>
      <text class="sub" x="300" y="500" text-anchor="middle">live traffic</text>
    </g>
    <g class="box b-pdb">
      <rect class="frame" x="130" y="760" width="340" height="120" rx="18"/>
      <text class="name" x="300" y="813" text-anchor="middle">Prod DB</text>
      <text class="sub" x="300" y="850" text-anchor="middle">live data</text>
    </g>
    <g class="box b-dapp">
      <rect class="frame" x="610" y="410" width="340" height="120" rx="18"/>
      <text class="name" x="780" y="463" text-anchor="middle">DR services</text>
      <text class="sub" x="780" y="500" text-anchor="middle">maintenance check</text>
    </g>
    <g class="box b-drep">
      <rect class="frame" x="610" y="760" width="340" height="120" rx="18"/>
      <text class="name" x="780" y="813" text-anchor="middle">DR replica</text>
      <text class="sub" x="780" y="850" text-anchor="middle">standby copy</text>
    </g>

    <!-- failure on prod DB -->
    <g class="f-db">
      <rect x="130" y="760" width="340" height="120" rx="18" fill="none" stroke="var(--red)" stroke-width="5"/>
      <circle cx="460" cy="752" r="20" fill="var(--red)"/>
      <path d="M 452 744 L 468 760 M 468 744 L 452 760" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- fix: fence between sites, cross-site call stops at it -->
    <g class="fence">
      <path d="M 540 400 L 540 740" stroke="var(--lime)" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="stub">
      <path d="M 700 530 L 700 645 L 566 645" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>
      <circle cx="540" cy="645" r="22" fill="var(--red)"/>
      <path d="M 531 636 L 549 654 M 549 636 L 531 654" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- problem callout -->
    <g class="lost">
      <rect x="170" y="980" width="740" height="60" rx="12" fill="#3a1416" stroke="var(--red)" stroke-width="2"/>
      <text x="540" y="1020" text-anchor="middle" font-size="26" font-weight="700" style="fill: #ffb3b5">DR services connected to the prod database</text>
    </g>

    <!-- fix note -->
    <g class="note">
      <rect x="140" y="980" width="800" height="60" rx="12" fill="#2a4a12" stroke="var(--lime)" stroke-width="2"/>
      <text x="540" y="1020" text-anchor="middle" font-size="26" font-weight="700" style="fill: var(--lime)">DR talks only to DR · prod denies cross-site</text>
    </g>

    <!-- moving packet: only on the DR services → DR replica arrow, between boxes, never over text -->
    <circle class="pkt p1" r="13" fill="var(--lime)"/>
  </svg>

  <div class="bottom">Isolate DR first. <span>Then test it.</span></div>
  <div class="brand">geminislabs.com</div>
  <div class="step s1">1 / 2 · the problem</div>
  <div class="step s2">2 / 2 · the fix</div>
</body>
</html>
