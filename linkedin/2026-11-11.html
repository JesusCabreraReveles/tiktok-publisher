<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="duration" content="15">
<meta name="size" content="1080x1350">
<title>Retry Storms</title>
<style>
  :root {
    --bg: #0c1a13; --panel: #13281d; --line: #2c5a40;
    --green: #2ecc71; --lime: #c6f432; --text: #eaf5ee; --muted: #8fb5a0; --red: #ff5a5f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; color: var(--text); position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: radial-gradient(circle, #1d3a2a 2px, transparent 2.5px);
    background-size: 44px 44px; opacity: .55; }
  .tag { position: absolute; left: 80px; top: 70px; font-size: 28px; font-weight: 700;
    letter-spacing: 4px; color: var(--lime); animation: in .5s ease-out 0s both; }
  .title { position: absolute; left: 80px; top: 120px; width: 920px; font-size: 72px;
    font-weight: 800; line-height: 1.05; letter-spacing: -1px; }
  .t1 { animation: in .5s ease-out .1s both, out .4s ease-in 6.0s forwards; }
  .t2 { animation: in .5s ease-out 6.45s both; }
  .t2 span, .t1 span { color: var(--lime); }
  .bottom { position: absolute; left: 80px; right: 80px; top: 1170px; font-size: 40px;
    font-weight: 700; text-align: center; animation: in .6s ease-out 10.8s both; }
  .bottom span { color: var(--lime); }
  .brand { position: absolute; left: 80px; bottom: 34px; font-size: 22px; color: var(--muted);
    animation: in .5s 0s both; }
  .step { position: absolute; right: 80px; bottom: 34px; font-size: 22px; color: var(--muted); }
  .s1 { animation: in .3s 0s both, out .3s 6.0s forwards; }
  .s2 { animation: in .3s 6.45s both; }
  svg { position: absolute; left: 0; top: 0; }
  svg text { font-family: "Inter", "DejaVu Sans", sans-serif; fill: var(--text); }

  .box rect { fill: var(--panel); stroke: var(--line); stroke-width: 3; }
  .box .name { font-size: 36px; font-weight: 700; }
  .box .sub { font-size: 24px; fill: var(--muted); }

  .draw { fill: none; stroke: var(--green); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; }
  .flow { fill: none; stroke: var(--lime); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: .1 .12; opacity: 0; }

  /* phase 1: the problem */
  .b-cli  { animation: pop .5s ease-out .5s both; }
  .b-api  { animation: pop .5s ease-out .8s both; }
  .b-db   { animation: pop .5s ease-out 1.1s both; }
  .a-main { animation: draw .6s ease-in-out 1.5s forwards; }
  .a-db   { animation: draw .6s ease-in-out 2.0s forwards, out .3s 8.0s forwards; }
  .a-s1   { animation: draw .3s ease-in-out 8.9s forwards; }
  .a-s2   { animation: draw .3s ease-in-out 9.1s forwards; }
  .hot    { opacity: 0; transform-box: fill-box; transform-origin: left center;
            animation: in .2s 2.6s forwards, grow 1s ease-out 2.6s both, out .4s 6.0s forwards; }
  .over   { animation: in .4s 2.8s both, out .4s 6.0s forwards; }
  .crash  { animation: pop .3s ease-out 3.0s both, shake .4s 3.0s, out .4s 6.0s forwards; }
  .r1     { stroke: var(--red); animation: draw .4s ease-in 3.3s forwards, out .4s 6.0s forwards; }
  .r2     { stroke: var(--red); animation: draw .4s ease-in 3.6s forwards, out .4s 6.0s forwards; }
  .lost   { animation: in .4s 3.6s both, out .4s 6.0s forwards; }

  /* phase 2: the fix */
  .ok     { animation: in .4s 6.5s both; }
  .a-pol  { stroke: var(--lime); animation: draw .3s ease-in-out 6.7s forwards; }
  .b-pol  { animation: pop .5s ease-out 6.9s both; }
  .row1   { animation: in .4s 7.3s both; }
  .row2   { animation: in .4s 7.6s both; }
  .row3   { animation: in .4s 7.9s both; }
  .b-brk  { animation: pop .5s ease-out 8.4s both; }
  .flow   { animation: in .3s 9.4s forwards, dash 1s linear 9.4s infinite; }

  /* packets only travel in the empty gap between Clients and API */
  .pkt { offset-rotate: 0deg; opacity: 0; offset-path: path("M 428 400 L 612 400"); }
  .k1 { animation: in .1s 9.1s forwards, move 2.4s ease-in-out 9.1s infinite; }
  .k2 { animation: in .1s 9.8s forwards, move 2.4s ease-in-out 9.8s infinite; }
  .k3 { animation: in .1s 10.9s forwards, move 2.4s ease-in-out 10.9s infinite; }

  @keyframes in   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes out  { to { opacity: 0; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { from { transform: scaleX(.3); } to { transform: scaleX(1); } }
  @keyframes dash { to { stroke-dashoffset: -.22; } }
  @keyframes move { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; }
                    60% { offset-distance: 100%; opacity: 1; } 70%, 100% { offset-distance: 100%; opacity: 0; } }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -8px 0; } 75% { translate: 8px 0; } }
  g { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="tag">ARCHITECTURE · WEDNESDAY</div>
  <div class="title t1">Naive retries<br><span>amplify outages.</span></div>
  <div class="title t2">The fix:<br><span>retry with discipline.</span></div>

  <svg width="1080" height="1350" viewBox="0 0 1080 1350">
    <!-- arrows (under the boxes) -->
    <path class="draw a-main" pathLength="1" d="M 410 400 L 630 400"/>
    <path class="draw r1" pathLength="1" d="M 410 445 L 630 445"/>
    <path class="draw r2" pathLength="1" d="M 410 490 L 630 490"/>
    <path class="draw a-db" pathLength="1" d="M 795 520 L 795 900"/>
    <path class="draw a-s1" pathLength="1" d="M 795 520 L 795 640"/>
    <path class="draw a-s2" pathLength="1" d="M 795 780 L 795 900"/>
    <path class="draw a-pol" pathLength="1" d="M 250 520 L 250 600"/>
    <!-- flowing dashes only on the bare segments, never inside a box -->
    <path class="flow" pathLength="1" d="M 795 528 L 795 632"/>
    <path class="flow" pathLength="1" d="M 795 788 L 795 892"/>

    <!-- Clients -->
    <g class="box b-cli">
      <rect x="90" y="360" width="320" height="160" rx="18"/>
      <text class="name" x="250" y="432" text-anchor="middle">Clients</text>
      <text class="sub" x="250" y="470" text-anchor="middle">web · mobile · jobs</text>
    </g>

    <!-- API -->
    <g class="box b-api">
      <rect x="630" y="360" width="330" height="160" rx="18"/>
      <text class="name" x="795" y="432" text-anchor="middle">Checkout API</text>
      <text class="sub" x="795" y="470" text-anchor="middle">calls the DB</text>
    </g>

    <!-- Database with load bar -->
    <g class="box b-db">
      <rect x="630" y="900" width="330" height="190" rx="18"/>
      <text class="name" x="795" y="958" text-anchor="middle">Database</text>
      <rect x="670" y="990" width="250" height="30" rx="8" style="fill:#1b3a29; stroke:none"/>
      <rect x="670" y="990" width="75" height="30" rx="8" style="fill:#2ecc71; stroke:none"/>
    </g>
    <rect class="hot" x="670" y="990" width="250" height="30" rx="8" fill="var(--red)"/>
    <text class="over" x="795" y="1062" text-anchor="middle" font-size="24" font-weight="700" style="fill: #ffb3b5">overloaded</text>
    <text class="ok" x="795" y="1062" text-anchor="middle" font-size="24" font-weight="700" style="fill: var(--lime)">recovering</text>

    <!-- timeout on the DB call -->
    <g class="crash">
      <circle cx="795" cy="710" r="40" fill="var(--red)"/>
      <path d="M 777 692 L 813 728 M 813 692 L 777 728" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="lost">
      <rect x="90" y="682" width="520" height="56" rx="12" fill="#3a1416" stroke="var(--red)" stroke-width="2"/>
      <text x="350" y="719" text-anchor="middle" font-size="26" font-weight="700" style="fill: #ffb3b5">every retry hits a sick DB</text>
    </g>

    <!-- Retry policy (fix) -->
    <g class="box b-pol">
      <rect x="90" y="600" width="320" height="270" rx="18" style="stroke: var(--lime)"/>
      <text class="name" x="250" y="652" text-anchor="middle">Retry policy</text>
    </g>
    <g class="row1">
      <rect x="115" y="678" width="270" height="52" rx="10" fill="#1b3a29"/>
      <text x="140" y="713" font-size="26" font-weight="600">backoff</text>
    </g>
    <g class="row2">
      <rect x="115" y="742" width="270" height="52" rx="10" fill="#1b3a29"/>
      <text x="140" y="777" font-size="26" font-weight="600">+ jitter</text>
    </g>
    <g class="row3">
      <rect x="115" y="806" width="270" height="52" rx="10" fill="#2a4a12" stroke="var(--lime)" stroke-width="2"/>
      <text x="140" y="841" font-size="26" font-weight="600" style="fill: var(--lime)">retry budget</text>
    </g>

    <!-- Circuit breaker (fix) -->
    <g class="box b-brk">
      <rect x="645" y="640" width="300" height="140" rx="18" style="stroke: var(--lime)"/>
      <text class="name" x="795" y="700" text-anchor="middle" font-size="32">Circuit breaker</text>
      <text class="sub" x="795" y="740" text-anchor="middle">fails fast</text>
    </g>

    <!-- spaced-out requests (jitter) -->
    <circle class="pkt k1" r="13" fill="var(--lime)"/>
    <circle class="pkt k2" r="13" fill="var(--lime)"/>
    <circle class="pkt k3" r="13" fill="var(--lime)"/>
  </svg>

  <div class="bottom">Retry less, <span>recover sooner.</span></div>
  <div class="brand">geminislabs.com</div>
  <div class="step s1">1 / 2 · the problem</div>
  <div class="step s2">2 / 2 · the fix</div>
</body>
</html>
